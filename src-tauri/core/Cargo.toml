[package]
name = "tubetray-core"
version = "0.1.0"
edition = "2021"
description = "Núcleo do TubeTray: fila, execução do yt-dlp e leitura de progresso. Sem dependência de UI."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros", "time", "fs"] }
tokio-util = { version = "0.7", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
log = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
