name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npx tsc -b
      - run: cargo test --manifest-path src-tauri/core/Cargo.toml

  bundle:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - run: npm ci
      # a versão do app sai da tag (v0.1.2 → 0.1.2), sem precisar editar arquivos
      - name: Versão a partir da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = v;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
            console.log("versão", v);
          '
      - run: npm run fetch:ffmpeg -- ${{ matrix.target }}
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          # em tags v*, cria o release (rascunho até o job publish terminar)
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: TubeTray ${{ github.ref_name }}
          releaseDraft: true
      # Cópia com nome fixo no release, para links diretos que sempre baixam a
      # última versão: releases/latest/download/TubeTray-windows-x64-setup.exe
      - name: Instalador com nome fixo
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc) src=$(ls "$bundle"/nsis/*-setup.exe | head -1); dst=TubeTray-windows-x64-setup.exe ;;
            aarch64-apple-darwin)   src=$(ls "$bundle"/dmg/*.dmg | head -1);       dst=TubeTray-macos-apple-silicon.dmg ;;
            x86_64-apple-darwin)    src=$(ls "$bundle"/dmg/*.dmg | head -1);       dst=TubeTray-macos-intel.dmg ;;
          esac
          cp "$src" "$dst"
          gh release upload "${{ github.ref_name }}" "$dst" --clobber --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: TubeTray-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  # Depois que os três instaladores sobem, publica o release (sai do rascunho
  # e vira "Latest"). A partir daí os links releases/latest/download/... do
  # site e do README baixam direto esta versão.
  publish:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest --repo "${{ github.repository }}"
